# workflow_dispatch с списком публичных URL (результаты Higgsfield CDN / загрузки) → файлы коммитятся в ветку, с которой запущен.
# Запускается сессией по D-14 (после явной цели владельца «deliver/full_rc*.mp4 существует»): это единственный путь
# доставить mp4 из CDN в deliver/, т.к. egress-политика сессии закрывает CDN Higgsfield.
name: fetch-assets
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Публичные URL через пробел (mp4/png/jpg/wav)"
        required: true
      dest:
        description: "Папка назначения в репо"
        default: "deliver/fetched"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p "${{ github.event.inputs.dest }}"
          for u in ${{ github.event.inputs.urls }}; do curl -sSL -o "${{ github.event.inputs.dest }}/$(basename "${u%%\?*}")" "$u"; done
          ls -la "${{ github.event.inputs.dest }}"
      - name: commit
        run: |
          git config user.name "fetch-assets"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "fetch-assets: $(date -u +%FT%TZ)" && git push
